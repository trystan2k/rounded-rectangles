name: Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json
        # (single source of truth; Corepack users get the same pin).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Deploy to Vercel (production)
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VERCEL_OUTPUT=$(npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          DEPLOY_URL=$(printf '%s\n' "$VERCEL_OUTPUT" | grep -oE 'https://[^[:space:]]+' | tail -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not parse deployment URL from Vercel output"
            exit 1
          fi
          {
            echo '## 🚀 Vercel production deployment'
            echo ''
            echo "Deployed to: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
